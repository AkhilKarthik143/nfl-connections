<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NFL Connections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .picker-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:10}.picker{width:min(525px,100%);background:#20211f;border:1px solid #4a4a45;border-radius:16px;padding:22px;box-shadow:0 25px 80px #000;display:grid;gap:10px}.picker header{display:flex;align-items:center;justify-content:space-between;color:#c2c2bd;font-size:14px;font-weight:700;letter-spacing:.05em}.picker-close{background:transparent;color:#c2c2bd;padding:0;font-weight:600}.picker #move{background:#292a28;border-color:#444540;font-size:20px}.picker-results{display:grid;gap:8px;min-height:96px;color:#aaa;padding:4px 0}.picker-option{background:#292a28;color:#e9e9e5;border:1px solid #3e3f3a;padding:10px 13px;display:flex;justify-content:space-between;text-align:left}.picker-option:hover{border-color:#d4af37}.picker-option small{color:#aaa;font-size:15px;font-weight:500}.picker-selected{padding:14px;border:1px solid #d4af37;border-radius:8px;color:#f1eee2}.picker-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.picker-actions .give-up{background:#8f302d;color:#fff}.picker-actions #submit{background:#28753e;color:#fff}.helper-button{background:transparent;border:1px solid #4a4a45;color:#c2c2bd;padding:8px}.helper{color:#d4af37;min-height:18px;font-size:13px;text-align:center}@media(max-width:500px){.picker{padding:16px}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js?v=1c9a327"></script>
</body>
</html>
